framework:
    html_sanitizer:
        sanitizers:
            # Nettoie le HTML déjà rendu par Jira (`renderedFields`, `renderedBody`) avant
            # son affichage en `|raw`. La sécurité ne repose plus uniquement sur le
            # nettoyage effectué côté Atlassian (audit sécurité §4.2).
            jira_description:
                # Base : le jeu d'éléments/attributs « safe » du standard W3C Sanitizer API.
                # Il couvre tout ce que Jira produit (titres, tableaux, listes, blocs de
                # code, <time>, <video>, <audio>...) et exclut par construction <script>,
                # <iframe>, <object>, <embed>, <svg> ainsi que tous les gestionnaires `on*`.
                allow_safe_elements: true

                allow_attributes:
                    # `class` est hors du jeu « safe » W3C mais Jira s'en sert massivement
                    # (panneaux de code, tableaux, émoticônes) : sans lui le rendu se dégrade.
                    class: '*'
                    # `style` reste limité aux médias : IssueHtmlProcessor y injecte
                    # `max-width: 100%` et conserve la largeur d'origine des captures.
                    style: ['img', 'video']

                # Supprime ces éléments *avec leur contenu* : sans cela le sanitizer se
                # contente de retirer la balise et le corps du script s'afficherait en texte.
                drop_elements:
                    - script
                    - style
                    - iframe
                    - object
                    - embed
                    - form
                    - input
                    - button
                    - textarea
                    - select

                # Les URLs réécrites par IssueHtmlProcessor sont relatives
                # (/app/attachment/..., /browse/...) : sans ceci elles seraient supprimées.
                allow_relative_links: true
                allow_relative_medias: true

                allowed_link_schemes: ['http', 'https', 'mailto']
                allowed_media_schemes: ['http', 'https']

                # Isole l'onglet ouvert par un lien externe de la page d'origine.
                force_attributes:
                    a:
                        rel: 'noopener noreferrer'

                # Garde-fou mémoire sur des descriptions Jira anormalement longues.
                max_input_length: 500_000
