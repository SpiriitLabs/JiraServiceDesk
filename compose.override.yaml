# Development environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
      args:
        - APP_USER_ID=${APP_USER_ID}
        - APP_GROUP_ID=${APP_GROUP_ID}
    volumes:
      - ./:/app
      # Caddy/Mercure data & config: bind-mounted to host dirs owned by the
      # host user so the non-root "project" user in the container can write
      # (mercure.db, Caddy autosave). Named volumes would be root-owned.
      - ./.docker/caddy/data:/data
      - ./.docker/caddy/config:/config
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
    depends_on:
      database:
        condition: service_healthy
      # Restore the local seed dump before the entrypoint runs the migrations
      db-seed:
        condition: service_completed_successfully

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - database
    links:
      - "database:database"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"

  mailer:
    image: axllent/mailpit
    volumes:
      - mailpit:/data
    ports:
      - "1080:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  database:
    ports:
      - "5432"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: imports .docker/database/dumps/seed.sql when the database is
  # empty (fresh datadir, dropped database...), no-op otherwise.
  db-seed:
    image: mariadb
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      MARIADB_HOST: database
      MARIADB_DATABASE: app
      MARIADB_ROOT_PASSWORD: root
      SEED_FILE: /dumps/seed.sql
    volumes:
      - ./.docker/database/dumps:/dumps:ro
      - ./.docker/database/scripts/seed-if-empty:/usr/local/bin/seed-if-empty:ro
    entrypoint: ["seed-if-empty"]

  # Node
  node:
    image: node:lts-alpine
    build: ./.docker/node/
    tty: true
    working_dir: /app
    depends_on:
      - php
    volumes:
      - ./:/app
    environment:
      NODE_ENV: development
    ports:
      - 5173:5173

volumes:
  mailpit:
